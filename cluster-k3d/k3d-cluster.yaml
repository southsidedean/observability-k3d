# k3d-cluster.yaml
# k3d-cluster.yaml
# Cluster configuration using k3d
# Tom Dean
# Last edit: 9/29/2025
#
# k3d configuration docs:
# https://k3d.io/stable/usage/configfile/

apiVersion: k3d.io/v1alpha5
kind: Simple
servers: 1
agents: 3
network: $CLUSTER_NETWORK
image: $K3S_VERSION
kubeAPI:
  hostIP: "0.0.0.0"
  hostPort: "7601"
ports:
  - port: $SYSLOG_PORT_TCP:$SYSLOG_PORT_TCP/tcp
    nodeFilters:
      - loadbalancer
  - port: 7001:80
    nodeFilters:
      - loadbalancer
  - port: 7401:443
    nodeFilters:
      - loadbalancer
volumes:
  - volume: $PERSISTENT_DATA_PATH:$PERSISTENT_DATA_PATH
    nodeFilters:
      - server:*
      - agent:*
options:
  k3d:
    disableLoadbalancer: false
  k3s:
    extraArgs:
      - arg: --debug
        nodeFilters:
          - server:*
          - agent:*
      - arg: --disable=traefik
        nodeFilters:
          - server:*
    nodeLabels:
      - label: topology.kubernetes.io/zone=observability-1
        nodeFilters: [agent:0]
      - label: topology.kubernetes.io/zone=observability-2
        nodeFilters: [agent:1]
      - label: topology.kubernetes.io/zone=observability-3
        nodeFilters: [agent:2]
      - label: egressgateway=true
        nodeFilters: [agent:*]
  kubeconfig:
    updateDefaultKubeconfig: true # add new cluster to your default Kubeconfig; same as `--kubeconfig-update-default` (default: true)
    switchCurrentContext: false # also set current-context to the new cluster's context; same as `--kubeconfig-switch-context` (default: true)