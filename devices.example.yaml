# Your network's devices. Copy this file to devices.yaml (which is never committed) and list
# your own. ok3d checks each one and alerts you when it fails; adding a device is one entry.
#
# Each device has:
#   name:      what you call it, shown in alerts and on Grafana's Devices dashboard
#   address:   its IPv4 address or host name
#   role:      gateway, switch, access-point, server, nas, ups, camera, printer, controller,
#              or other
#   behind:    the device it connects through (by name), carried on its alerts; from 0.7, a
#              failed switch will be one alert, not one for every device behind it
#   checks:    what to check: ping, http, https, or a TCP port such as tcp:22
#   metrics:   ports where it serves Prometheus metrics, such as 9100 for node_exporter
#   protected: true means no action may ever touch it, even with your approval (from 0.9)

devices:
  - name: router
    address: 192.168.1.1
    role: gateway
    checks: [ping, https]
    protected: true

  - name: office-switch
    address: 192.168.1.2
    role: switch
    behind: router
    checks: [ping]

  - name: nas
    address: 192.168.1.20
    role: nas
    behind: office-switch
    checks: [ping, https, tcp:22]
    protected: true
