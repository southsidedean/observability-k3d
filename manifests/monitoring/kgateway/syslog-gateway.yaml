apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: syslog-gateway
  namespace: kgateway-system
  labels:
    app: syslog
spec:
  gatewayClassName: kgateway
  listeners:
  - protocol: TCP
    port: $SYSLOG_PORT_TCP  # External port for TCP syslog (expanded via envsubst)
    name: tcp-syslog
    allowedRoutes:
      namespaces:
        from: "All"
      kinds:
      - kind: TCPRoute
