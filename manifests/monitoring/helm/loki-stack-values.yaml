loki:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
    existingClaim: loki-pvc
    storageClassName: "local-path"
  podSecurityContext:
    fsGroup: 10001
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
  # The ruler component queries the query-frontend to evaluate rules.
  # In a single-binary setup, both are in the same pod. We need to explicitly
  # tell the ruler to query itself using the correct service name ('loki').
  # This overrides a chart default that can sometimes be incorrect.
  # config:
  #   ruler:
  #     query_frontend_address: 'loki.monitoring.svc.cluster.local:3100'
  # The following is the default for single-binary mode and ensures
  # Loki doesn't try to discover other non-existent pods.
  ring:
    kvstore:
      store: inmemory
promtail:
  enabled: true
  config:
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      # Collect logs from Kubernetes pods
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: ['__meta_kubernetes_pod_controller_name']
            regex: '([0-9a-z-.]+?)(-[0-9a-f]{8,10})?'
            target_label: '__tmp_controller_name'
          - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_name', '__meta_kubernetes_pod_label_app', '__tmp_controller_name', '__meta_kubernetes_pod_name']
            regex: '^;*([^;]+)(;.*)?$'
            target_label: 'app'
          - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_instance', '__meta_kubernetes_pod_label_instance']
            regex: '^;*([^;]+)(;.*)?$'
            target_label: 'instance'
          - source_labels: ['__meta_kubernetes_pod_label_app_kubernetes_io_component', '__meta_kubernetes_pod_label_component']
            regex: '^;*([^;]+)(;.*)?$'
            target_label: 'component'
          - action: replace
            source_labels: ['__meta_kubernetes_pod_node_name']
            target_label: 'node_name'
          - action: replace
            source_labels: ['__meta_kubernetes_namespace']
            target_label: 'namespace'
          - action: replace
            source_labels: ['__meta_kubernetes_pod_name']
            target_label: 'pod'
          - action: replace
            source_labels: ['__meta_kubernetes_pod_container_name']
            target_label: 'container'
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels: ['__meta_kubernetes_pod_uid', '__meta_kubernetes_pod_container_name']
            target_label: '__path__'
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            regex: 'true/(.*)'
            separator: /
            source_labels: ['__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash', '__meta_kubernetes_pod_annotation_kubernetes_io_config_hash', '__meta_kubernetes_pod_container_name']
            target_label: '__path__'
      # Collect syslog from external hosts
      - job_name: syslog
        syslog:
          listen_address: 0.0.0.0:1514
          idle_timeout: 60s
          label_structured_data: yes
          labels:
            job: "syslog"
        relabel_configs:
          - source_labels: ['__syslog_message_hostname']
            target_label: 'host'
          - source_labels: ['__syslog_message_app_name']
            target_label: 'app'

  extraPorts:
    syslog-tcp:
      enabled: true
      containerPort: 1514
      protocol: TCP
      service:
        enabled: true
        type: ClusterIP
#        nodePort: 30114
#    syslog-udp:
#      enabled: true
#      containerPort: 1514
#      protocol: UDP
#      service:
#        enabled: true
#        type: NodePort
#        nodePort: 30115

grafana:
  enabled: false

prometheus:
  enabled: false

fluent-bit:
  enabled: false
