apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  alerts.yaml: |
    apiVersion: 1
    # NOTE: System-level CPU/memory alerts are defined in Prometheus rules
    # (alerts/prometheus-rules.yaml) to avoid duplicate notifications.
    # Only Loki-based log alerts are defined here in Grafana.
    groups:
      - orgId: 1
        name: log-alerts
        folder: Security
        interval: 1m
        rules:
          - uid: ssh-bruteforce
            title: SSH Brute Force Detected
            condition: B
            labels:
              severity: critical
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: loki
                model:
                  expr: count_over_time({app="sshd"} |= "Failed password"[5m])
                  legendFormat: "failed logins"
                  format: time_series
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  conditions:
                    - evaluator: { params: [10], type: gt }
                      operator: { type: and }
                      query: { params: [A] }
                      reducer: { type: last }
            annotations:
              summary: "SSH brute force attempt on {{ $labels.host }}"
              description: ">10 failed SSH logins in 5 minutes."
          - uid: sudo-failure
            title: Sudo Authentication Failures
            condition: B
            labels:
              severity: warning
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: loki
                model:
                  expr: count_over_time({app="sudo"} |= "authentication failure"[10m])
                  legendFormat: "sudo failures"
                  format: time_series
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  conditions:
                    - evaluator: { params: [5], type: gt }
                      operator: { type: and }
                      query: { params: [A] }
                      reducer: { type: last }
            annotations:
              summary: "Excessive sudo failures on {{ $labels.host }}"
              description: "More than 5 sudo failures in 10 minutes."
