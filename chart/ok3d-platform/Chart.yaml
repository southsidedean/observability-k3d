# The platform chart: what the ok3d chart builds on, installed first. Helm can't use a custom
# resource definition in the same install that brings it, so the definitions (and the
# controllers that act on them) come in this release, and everything that uses them in the
# next. It grows as the roadmap goes on: the Prometheus operator's definitions in 0.4, Istio in
# 0.8, and kagent's in 0.9.
#
# Dependencies are pinned, and `helm dependency build chart/ok3d-platform` fetches them (into
# charts/, which isn't committed) at the versions in Chart.lock. `ok3d apply` does that for
# you. Renovate proposes newer versions.
apiVersion: v2
name: ok3d-platform
description: The definitions and controllers the ok3d chart builds on.
type: application
version: 0.5.2-dev0
appVersion: 0.5.2.dev0
home: https://github.com/southsidedean/observability-k3d
dependencies:
  # Issues the web pages' certificates, from ok3d's own authority (and, from 1.1, from
  # Let's Encrypt).
  - name: cert-manager
    version: v1.21.3
    repository: https://charts.jetstack.io
  # The Prometheus operator's definitions (ServiceMonitor, Probe, PrometheusRule, ScrapeConfig,
  # and the rest), for the same operator version kube-prometheus-stack runs in the ok3d chart.
  - name: prometheus-operator-crds
    version: 32.0.1
    repository: https://prometheus-community.github.io/helm-charts
