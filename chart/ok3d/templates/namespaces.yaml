{{- /*
ok3d's namespaces, one per kind of work, so access rules can be written per namespace. Each
enforces Kubernetes' "restricted" Pod Security Standard: a pod that runs as root, keeps
capabilities, or allows privilege escalation is refused at the door. A piece that needs more
(the blackbox exporter's ping, from 0.4) gets an exception in its own namespace, with the
reason written next to it.
*/ -}}
{{- $namespaces := dict
  "monitoring" "Prometheus, Alertmanager, Grafana, Loki, and the exporters."
  "gateway" "agentgateway: the one way into the web pages, and the route to the AI model."
  "auth" "Authelia and the Approvals page."
  "agents" "kagent, the MCP servers, and the action runner."
}}
{{- range $name, $about := $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    {{- include "ok3d.labels" $ | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    ok3d/holds: {{ $about | quote }}
{{- end }}
