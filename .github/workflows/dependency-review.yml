name: dependency review

# Blocks a pull request that adds or upgrades a dependency with a known vulnerability of
# high severity or worse, or one under a license that can't be combined with the AGPL.
on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Licenses that can't be shipped in an AGPL-3.0 project.
          deny-licenses: SSPL-1.0, BUSL-1.1, Commons-Clause
