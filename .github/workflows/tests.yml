name: tests

# The checks every pull request must pass before it can merge (each job is a required check
# on main). scripts/check.sh runs the same checks locally. Jobs for the charts, the alert
# rules, the dashboards, the images, the docs' generated pages, and the end-to-end smoke test
# join this file in the releases that bring what they check (PLAN.md, "Workflows").
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new release of a tool or of Python that breaks something shows up even in a
  # quiet week.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run. Each push to main gets a run
# of its own, so none is skipped when merges come close together.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python -m pip install -e ".[dev]"
      - name: ruff (bugs and risky code; settings in pyproject.toml)
        run: python -m ruff check src tests
      - name: bandit (security problems in the package)
        run: python -m bandit -q -c pyproject.toml -r src
      - name: mypy (types, strict)
        run: python -m mypy
      # shellcheck comes with the runner.
      - name: shellcheck (the scripts and git hooks, as POSIX sh)
        run: shellcheck -s sh ok3d scripts/check.sh scripts/diagrams.sh .githooks/*
      - name: zizmor (these workflows' security)
        run: zizmor --offline --min-severity medium .github/workflows
      # actionlint, pinned to a release and checked against that release's published checksum.
      - name: actionlint (mistakes in these workflows)
        run: |
          curl -fsSLo "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      # Node.js comes with the runner. The validator's version is pinned like everything else.
      - name: Renovate's settings
        run: npx --yes --package renovate@44.155.1 -- renovate-config-validator --strict

  charts:
    name: charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Helm 4, the version the test VM and the docs use.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python -m pip install -e ".[dev]"
      # kubeconform, pinned to a release and checked against that release's published checksum.
      - name: kubeconform
        run: |
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tgz" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c
          mkdir "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: the charts lint, render, and pass kubeconform
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build chart/ok3d-platform
          helm dependency build chart/ok3d
          k8s=$(sed -n 's/^  k3sImage: rancher\/k3s:v\([0-9.]*\)-.*/\1/p' chart/ok3d/values.yaml)
          helm lint --strict chart/ok3d --values settings.example.yaml
          helm lint chart/ok3d-platform
          { helm template ok3d chart/ok3d --namespace monitoring --values settings.example.yaml --values devices.demo.yaml
            helm template ok3d-platform chart/ok3d-platform --namespace cert-manager
          } | kubeconform -strict -summary -kubernetes-version "$k8s" -skip CustomResourceDefinition \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      # promtool and amtool, from the Prometheus and Alertmanager versions ok3d runs, pinned
      # and checked against each release's published checksum.
      - name: promtool and amtool
        run: |
          curl -fsSLo "$RUNNER_TEMP/prometheus.tgz" \
            https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz
          echo "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0  $RUNNER_TEMP/prometheus.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/prometheus.tgz" -C "$RUNNER_TEMP/bin" --strip-components 1 prometheus-3.15.0.linux-amd64/promtool
          curl -fsSLo "$RUNNER_TEMP/alertmanager.tgz" \
            https://github.com/prometheus/alertmanager/releases/download/v0.34.1/alertmanager-0.34.1.linux-amd64.tar.gz
          echo "265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8  $RUNNER_TEMP/alertmanager.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/alertmanager.tgz" -C "$RUNNER_TEMP/bin" --strip-components 1 alertmanager-0.34.1.linux-amd64/amtool
      - name: the charts', alert rules', and Alertmanager's tests, with Helm 4, promtool, and amtool
        run: python -m pytest -q tests/test_charts.py tests/test_rules.py tests/test_alertmanager.py

  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python ok3d supports (Ubuntu 24.04's), and the newest release.
        python: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: pytest, with coverage (lines the tests never run are listed, for reading)
        run: python -m pytest -q --cov=ok3d --cov-report=term-missing:skip-covered

  # The scripts' and hooks' macOS branches under macOS's own sh and tools, which the Linux
  # runs only imitate.
  pytest-macos:
    name: pytest (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
